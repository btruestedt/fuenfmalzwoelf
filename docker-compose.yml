# Produktivbetrieb auf dem VPS (/srv/noeaux/fmz).
# Caddy läuft als eigener Stack (/srv/noeaux/proxy) und erreicht die App über das Netz "edge"
# unter http://fmz:8787 – dort gehen sowohl die Seite als auch der WebSocket (/ws) durch.
# Spielstände liegen in ./data/rooms.json. Der Ordner muss vor dem ersten Start existieren und
# für UID 1000 beschreibbar sein, sonst legt Docker ihn als root an.
name: fmz

services:
  app:
    build: .
    container_name: fmz
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # Nur lokal auf dem Server (für Prüfungen per curl); öffentlich nur über Caddy.
      - "127.0.0.1:8787:8787"
    networks:
      - edge

networks:
  # Gemeinsames Netz mit Caddy (angelegt vom Proxy-Stack).
  edge:
    external: true
